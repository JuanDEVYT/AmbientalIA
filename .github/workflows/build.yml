name: Build APK

on:
  push:
    branches: [ main, master ]
    tags: [ "v*" ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Compilar AmbientalIA
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Paquetes del SDK (API 35)
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SM="$(find "$SDK/cmdline-tools" -name sdkmanager -type f | sort -V | tail -1)"
          if [ -z "$SM" ]; then echo "::error::No encuentro sdkmanager en $SDK"; exit 1; fi
          echo "sdkmanager: $SM"
          yes | "$SM" --licenses > /dev/null || true
          "$SM" "platforms;android-35" "build-tools;35.0.0"

      # Firma de release: solo si el repo define los secretos.
      # (el contexto `secrets` no está permitido en `if`, se comprueba en el shell)
      - name: Preparar keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "Sin secretos de keystore: la release saldrá sin firmar (usa el APK de debug)."
          fi

      - name: Compilar
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle :app:assembleRelease :app:assembleDebug --stacktrace

      - name: Subir APKs
        uses: actions/upload-artifact@v4
        with:
          name: AmbientalIA-apk
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Release con APK
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk
          generate_release_notes: true
